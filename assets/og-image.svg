<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .sans { font-family: 'Helvetica Neue', sans-serif; }
    .mono { font-family: 'Ioskeley Mono', monospace; }
  </style>
  <rect width="1200" height="630" fill="#121212"/>

  <g class="sans" fill="#fff">
    <text x="78" y="176" font-size="82" font-weight="700">AI Stack</text>
    <text x="82" y="218" font-size="24" fill="#8b8b8b">the tools behind the work</text>
    <line x1="82" y1="270" x2="404" y2="270" stroke="#fff" stroke-width="2"/>
    <text x="82" y="340" font-size="27" font-weight="500">models → harnesses → tools</text>
    <text x="82" y="380" font-size="23" fill="#8b8b8b">hooks, MCPs, CLI, skills, workspace</text>
  </g>

  <line x1="536" y1="78" x2="536" y2="552" stroke="#242424" stroke-width="1"/>

  <g class="sans">
    <text x="588" y="128" font-size="24" font-weight="500" fill="#fff">Models</text>
    <text x="588" y="158" font-size="20" fill="#8b8b8b">GPT 5.6 Sol · GPT 5.6 Luna</text>
    <text x="588" y="185" font-size="20" fill="#8b8b8b">GPT Codex 5.3 Spark · GLM 5.3</text>
    <line x1="588" y1="214" x2="1126" y2="214" stroke="#242424"/>

    <text x="588" y="264" font-size="24" font-weight="500" fill="#fff">Harnesses</text>
    <text x="588" y="294" font-size="20" fill="#8b8b8b">Codex CLI · Hermes Agent</text>
    <text x="588" y="321" font-size="20" fill="#8b8b8b">Droid CLI · Antigravity CLI</text>
    <line x1="588" y1="350" x2="1126" y2="350" stroke="#242424"/>

    <text x="588" y="400" font-size="24" font-weight="500" fill="#fff">Tools</text>
    <text x="588" y="430" font-size="20" fill="#8b8b8b">23 MCPs · 18 CLI tools · 120 skills</text>
    <text x="588" y="457" font-size="20" fill="#8b8b8b">hooks · workspace · code review</text>
  </g>

  <text x="1126" y="572" text-anchor="end" class="mono" font-size="16" fill="#555">ai.micr.dev</text>
</svg>
