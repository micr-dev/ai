name: Refresh OG image

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render current OG image
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          node scripts/generate-og-image.mjs

      - name: Commit refresh when changed
        run: |
          if git diff --quiet; then
            echo "OG image is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/og-image.svg og-image.png
          git commit -m "site: refresh OG image"
          git push
